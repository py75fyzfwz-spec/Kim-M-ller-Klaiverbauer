      <rect x="170" y="0" width="8" height="16"/>
      <rect x="210" y="0" width="8" height="16"/>
      <rect x="270" y="0" width="8" height="16"/>
      <rect x="310" y="0" width="8" height="16"/>
      <rect x="370" y="0" width="8" height="16"/>
